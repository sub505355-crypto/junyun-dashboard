<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>뱃지 확인용 임시 페이지</title>
</head>
<body>
<script>
/* 임시 검증 페이지: 이 기기 저장소에 '안 읽은 소식 2개' 상태를 심고 대시보드를 연다. 검증 후 삭제한다. */
(function () {
  try {
    var KEY = 'junyun-family-v1';
    var now = Date.now();
    var chat = [
      { id: 'm1', who: 'mom', text: '오늘 숙제 다 했어?', at: now - 1800000 },
      { id: 'm2', who: 'jun', text: '응 다 했어!', at: now - 1700000 },
      { id: 'm3', who: 'dad', text: '간식 사 왔어', at: now - 60000 },
      { id: 'm4', who: 'mom', text: '이따 산책 가자', at: now - 30000 }
    ];
    localStorage.setItem(KEY, JSON.stringify({ v: 2, updatedAt: now, chat: chat, settings: { syncUrl: '', syncOn: false } }));
    localStorage.setItem(KEY + '-seen-v1', JSON.stringify({ ids: ['c:m1', 'c:m2'] }));
  } catch (e) {}
  location.replace('./index.html');
})();
</script>
</body>
</html>
