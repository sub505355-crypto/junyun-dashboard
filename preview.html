<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준윤😘 대시보드 · 미리보기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 36px; min-height: 100vh;
    font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; color: #5B4A3F;
    background:
      radial-gradient(circle at 12% 8%, #FFE3EC 0, transparent 45%),
      radial-gradient(circle at 88% 92%, #DDEEFF 0, transparent 45%),
      radial-gradient(circle at 80% 10%, #F0E7FF 0, transparent 42%),
      #FFF8EE;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  h1 { font-family: 'Jua'; font-weight: 400; font-size: 26px; color: #C26087; margin: 0; text-align: center; }
  p.sub { margin: -8px 0 0; font-size: 13px; color: #94806F; text-align: center; }
  .stage { display: flex; align-items: flex-end; gap: 34px; flex-wrap: wrap; justify-content: center; }
  .device { text-align: center; }
  .device .cap { font-family: 'Jua'; font-size: 15px; color: #8A6E5D; margin-bottom: 8px; }
  .frame {
    position: relative; padding: 12px; border-radius: 40px;
    background: linear-gradient(160deg, #FFFFFF, #F3E7DC);
    box-shadow: 0 24px 50px -22px rgba(150, 105, 80, .55), 0 2px 0 #fff inset;
    border: 2px solid #fff;
  }
  .frame::after {
    content: ""; position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
    width: 54px; height: 6px; border-radius: 99px; background: #E9DCD0;
  }
  .phone .screen { width: 390px; height: 770px; }
  .tablet .screen { width: 820px; height: 1090px; }
  .screen { border: 0; border-radius: 28px; background: #FFF8EE; display: block; }
  .phone .frame { transform: scale(.80); transform-origin: top left; }
  .tablet .frame { transform: scale(.56); transform-origin: top left; }
  .phone .fit { width: 346px; height: 652px; overflow: hidden; }
  .tablet .fit { width: 488px; height: 638px; overflow: hidden; }
  .note { font-size: 11.5px; color: #A0887A; margin-top: 8px; }
  a { color: #E2708E; }
</style>
</head>
<body>
  <h1>🐵🐷 준윤😘 대시보드 미리보기</h1>
  <p class="sub">엄마 폰과 아이 태블릿에서 이렇게 보여요 · <a href="index.html">실제 화면 열기</a></p>

  <div class="stage">
    <div class="device phone">
      <div class="cap">📱 엄마 폰 (390px)</div>
      <div class="fit">
        <div class="frame"><iframe class="screen" src="index.html" title="휴대폰 미리보기" loading="eager" scrolling="no"></iframe></div>
      </div>
      <div class="note">한 손에 쏙 · 서준·서윤 용돈이 위에 나란히</div>
    </div>
    <div class="device tablet">
      <div class="cap">📲 아이 태블릿 (820px)</div>
      <div class="fit">
        <div class="frame"><iframe class="screen" src="index.html" title="태블릿 미리보기" loading="eager" scrolling="no"></iframe></div>
      </div>
      <div class="note">두 칸 카드 배치 · 타이머와 채팅이 넓게</div>
    </div>
  </div>
</body>
</html>
